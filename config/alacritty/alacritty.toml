[general]
import = ["~/.config/alacritty/color-schemes/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 1.0
blur = true

[font]
size = 11
normal = { family = "FiraCode Nerd Font", style = "Medium" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }

[cursor]
style = { shape = "Beam", blinking = "Always" }
vi_mode_style = { shape = "Beam", blinking = "Always" }
thickness = 0.3

[mouse]
hide_when_typing = true
