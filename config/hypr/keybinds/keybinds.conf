###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

############################
### VARIABLE DEFINITIONS ###
############################

# Main modifier key
$mainMod = SUPER # Sets "Windows" key as main modifier

# Directories
$scriptdir = ~/.config/hypr/scripts

# Applications
$terminal = alacritty
$fileManager = nemo
$webBrowser = firefox

# Audio keys
$volUp = XF86AudioRaiseVolume
$volDown = XF86AudioLowerVolume
$volMute = XF86AudioMute
$audioPrev = XF86AudioPrev
$audioPlay = XF86AudioPlay
$audioNext = XF86AudioNext
$micMute = XF86AudioMicMute

# Audio settings
$volincrement = 5%
$vollimit = 1.2

# Brightness keys
$brightnessUP = XF86MonBrightnessUp
$brightnessDown = XF86MonBrightnessDown

##############################
### CORE WINDOW MANAGEMENT ###
##############################

# Basic window operations
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, Q, togglesplit, # dwindle
bind = $mainMod SHIFT, F, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move/resize windows with mouse dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Special workspace (minimize simulation)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, S, movetoworkspace, +0
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, S, movetoworkspace, special:magic
bind = $mainMod, S, togglespecialworkspace, magic

############################
### WORKSPACE MANAGEMENT ###
############################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Navigate workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = ALT, TAB, workspace, e+1
bind = ALT_SHIFT, TAB, workspace, e-1

#############################
### APPLICATION LAUNCHERS ###
#############################

# Core applications
bind = $mainMod, X, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, exec, $webBrowser

# System utilities
bind = $mainMod, SUPER_L, exec, pkill rofi || rofi -show drun
bind = $mainMod, V, exec, alacritty --class clipse -e 'clipse'

# Screenshots
bind = $mainMod SHIFT, S, exec, $scriptdir/screenshot.sh partial
bind = ,Print, exec, $scriptdir/screenshot.sh full

#######################
### SYSTEM CONTROLS ###
#######################

# Audio controls
bindel = ,$volUp, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volincrement+ --limit $vollimit
bindel = ,$volDown, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volincrement-
bind = ,$volMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bind = ,$micMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media controls
bind = ,$audioPlay, exec, playerctl play-pause
bind = ,$audioPrev, exec, playerctl previous
bind = ,$audioNext, exec, playerctl next

# Brightness controls
bind = ,$brightnessDown, exec, brightnessctl set 5%-
bind = ,$brightnessUP, exec, brightnessctl set +5%

# Power and session management
bind = $mainMod, P, exec, $scriptdir/powermenu.sh
bind = $mainMod, L, exec, hyprlock
bind = ,XF86PowerOff, exec, systemctl suspend
bind = $mainMod CTRL SHIFT, BackSpace, exec, shutdown now

# Hardware toggles
bind = $mainMod SHIFT, T, exec, $scriptdir/touchpad-toggle.sh
